global:
  repotype: "public"
  product: corezoid
  serviceMonitor:
    enabled: true
  # imagePullSecrets:
  #   name: corezoid-secret-dbcall-new-prod
  imagePullPolicy: IfNotPresent
  imageInit:
    repository: hub.corezoid.com/hub.docker.com/library/alpine
    pullPolicy: IfNotPresent
    tag: "3.20"
  #######  RabbitMQ  ########
  ## Supported version  3.9.*
  mq:
    # if internal true - create and use internal rmq container
    # if internal false - enable external rmq (on aws ec2 instances as example)
    internal: true
    ## secret configuration for rabbitmq
    secret:
      ## create: true  — Helm creates the Secret from "data" below
      ## create: false — Secret is managed externally (Vault, External Secrets Operator, etc.);
      ##                  "data" section is not required.
      ##                  External Secret must contain keys: host, port, vhost, username, password
      create: true
      ## name — used to compute Secret name: {{ .Release.Name }}-dbcall-{{ name }}
      name: "rabbitmq-secret"
      ## secretName — override the full Secret name (ignores "name" above).
      ## Use when the external Secret has a name that doesn't follow the chart's naming convention.
      # secretName: "my-external-rabbitmq-secret"
      ## data is only used when create: true
      data:
        # host: "rabbitmq.rabbitmq.svc.cluster.local"
        host: "RABBTMQ_HOST"  # If internal: true, then this host
        port: "RABBTMQ_PORT"
        vhost: "RABBTMQ_VHOST"
        username: "RABBTMQ_USER"
        password: "RABBTMQ_PASSWORD"
    # vm_memory_high_watermark.relative
    memoryHighWatermark: 0.3
  dbcall:
    # Application configuration parameters
    # prefetch: "6000"  # RabbitMQ prefetch count (default: 6000)
    # max_response_size: "2097152"  # Maximum response size in bytes (default: 2097152 = 2MB)
    # log_level: "info"  # Log level (default: "info")
    corezoid_dbcall:
      tag: "2.2.0"
      minReplicas: 3
      maxReplicas: 10
      hpa:
        enabled: true
      resources:
        limits:
          memory: 500Mi
        requests:
          cpu: 100m
          memory: 200Mi
      secret:
        postgres:
          annotations: {}
      affinity: {}
